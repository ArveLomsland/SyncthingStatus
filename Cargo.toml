[package]
name = "syncthing-status"
version = "0.1.0"
edition = "2021"
description = "Viser status for Syncthing i systemtray"
license = "MIT"

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# libxdo (standard) trengs bare for hurtigtaster på Linux – droppes for færre systemavhengigheter
tray-icon = { version = "0.19", default-features = false }
open = "5"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_Registry",
] }

[target.'cfg(target_os = "linux")'.dependencies]
# må være samme gtk-versjon som tray-icon/libappindicator bruker
gtk = "0.18"

# ---- Ubuntu/Debian-pakke (cargo deb) ----
[package.metadata.deb]
maintainer = "Arve"
copyright = "2026, Arve"
section = "utils"
priority = "optional"
extended-description = """\
Viser status for en lokal Syncthing-instans som ikon i systemkurven: \
synkroniseringsstatus, tilkoblede enheter, overføringshastighet og status per mappe. \
Adresse og API-nøkkel leses automatisk fra Syncthing sin config.xml."""
depends = "$auto, libayatana-appindicator3-1 | libappindicator3-1"
assets = [
    ["target/release/syncthing-status", "usr/bin/", "755"],
    ["packaging/linux/syncthing-status.desktop", "usr/share/applications/", "644"],
    ["packaging/linux/syncthing-status-autostart.desktop", "etc/xdg/autostart/", "644"],
    ["packaging/linux/syncthing-status.svg", "usr/share/icons/hicolor/scalable/apps/", "644"],
    ["README.md", "usr/share/doc/syncthing-status/README.md", "644"],
]

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
