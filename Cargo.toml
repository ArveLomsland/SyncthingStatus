[package]
name = "syncthing-status"
version = "0.1.0"
edition = "2021"
description = "Shows Syncthing status in the system tray"
license = "MIT"

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# libxdo (default) is only needed for global shortcuts on Linux - dropped to reduce system dependencies
tray-icon = { version = "0.19", default-features = false }
open = "5"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_Registry",
] }

[target.'cfg(target_os = "linux")'.dependencies]
# must match the gtk version used by tray-icon/libappindicator
gtk = "0.18"

# ---- Ubuntu/Debian package (cargo deb) ----
[package.metadata.deb]
maintainer = "Arve Lomsland <arve.lomsland@proplan.no>"
copyright = "2026, Arve Lomsland"
section = "utils"
priority = "optional"
extended-description = """\
Shows the status of a local Syncthing instance as a system tray icon: \
sync status, connected devices, transfer speed and per-folder status. \
The address and API key are read automatically from Syncthing's config.xml."""
depends = "$auto, libayatana-appindicator3-1 | libappindicator3-1"
assets = [
    ["target/release/syncthing-status", "usr/bin/", "755"],
    ["packaging/linux/syncthing-status.desktop", "usr/share/applications/", "644"],
    ["packaging/linux/syncthing-status-autostart.desktop", "etc/xdg/autostart/", "644"],
    ["packaging/linux/syncthing-status.svg", "usr/share/icons/hicolor/scalable/apps/", "644"],
    ["README.md", "usr/share/doc/syncthing-status/README.md", "644"],
    ["LICENSE", "usr/share/doc/syncthing-status/LICENSE", "644"],
]

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
