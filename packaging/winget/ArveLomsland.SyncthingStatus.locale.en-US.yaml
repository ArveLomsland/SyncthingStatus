ShortDescription: Shows the status of a local Syncthing instance as a system tray icon.
Description: |-
  SyncthingStatus is a small Rust application that displays the status of a local
  Syncthing instance as a colour-coded system tray icon: up to date, syncing,
  paused, error or unreachable. The tooltip shows the Syncthing version, connected
  devices, remaining data and transfer speeds, and the menu lists per-folder
  completion. The address and API key are discovered automatically from
  Syncthing's config.xml.
